<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Search Appointment - Sunrise Dental Clinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container" style="max-width: 700px;">
    <h2>Display Appointment Details</h2>

    <form th:action="@{/appointments/search}" method="post" class="row g-2 mb-4">
        <div class="col-8">
            <input type="text" name="appointmentNo" class="form-control" placeholder="e.g. APT-0001"
                   th:value="${appointmentNo}" required>
        </div>
        <div class="col-4">
            <button type="submit" class="btn btn-primary w-100">Search</button>
        </div>
    </form>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div th:if="${appointment}" class="card">
        <div class="card-body">
            <h5 class="card-title" th:text="${appointment.appointmentNo}"></h5>
            <table class="table">
                <tr><th>Patient Name</th><td th:text="${appointment.patientName}"></td></tr>
                <tr><th>Address</th><td th:text="${appointment.address}"></td></tr>
                <tr><th>Contact Number</th><td th:text="${appointment.contactNo}"></td></tr>
                <tr><th>Dentist</th><td th:text="${appointment.dentistName}"></td></tr>
                <tr><th>Treatment Type</th><td th:text="${appointment.treatmentType}"></td></tr>
                <tr><th>Date</th><td th:text="${appointment.appointmentDate}"></td></tr>
                <tr><th>Time</th><td th:text="${appointment.appointmentTime}"></td></tr>
                <tr><th>Billed</th><td th:text="${appointment.billed} ? 'Yes' : 'No'"></td></tr>
            </table>
        </div>
    </div>
</div>
</body>
</html>
