<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register Appointment - Sunrise Dental Clinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container" style="max-width: 700px;">
    <h2>Register New Appointment</h2>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/appointments/new}" th:object="${appointment}" method="post">
        <div class="mb-3">
            <label class="form-label">Patient Name</label>
            <input type="text" th:field="*{patientName}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Address</label>
            <input type="text" th:field="*{address}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Contact Number (10 digits)</label>
            <input type="text" th:field="*{contactNo}" class="form-control" pattern="\d{10}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Dentist Name</label>
            <input type="text" th:field="*{dentistName}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Treatment Type</label>
            <select th:field="*{treatmentType}" class="form-select" required>
                <option value="">-- Select Treatment --</option>
                <option th:each="t : ${treatments}" th:value="${t}" th:text="${t}"></option>
            </select>
        </div>
        <div class="row">
            <div class="col mb-3">
                <label class="form-label">Appointment Date</label>
                <input type="date" th:field="*{appointmentDate}" class="form-control" required>
            </div>
            <div class="col mb-3">
                <label class="form-label">Appointment Time</label>
                <input type="time" th:field="*{appointmentTime}" class="form-control" required>
            </div>
        </div>
        <button type="submit" class="btn btn-primary">Register Appointment</button>
    </form>
</div>
</body>
</html>
