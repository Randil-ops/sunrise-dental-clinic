<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Unbilled Appointments - Sunrise Dental Clinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container">
    <h2>Unbilled Appointments</h2>
    <p class="text-muted">Appointments that have not yet had a bill generated &mdash; use this list to
        follow up with patients before their visit.</p>

    <p th:if="${#lists.isEmpty(appointments)}" class="alert alert-success">
        All appointments have been billed. Nothing outstanding.
    </p>

    <table class="table table-striped" th:unless="${#lists.isEmpty(appointments)}">
        <thead>
            <tr>
                <th>Appointment No.</th><th>Patient</th><th>Dentist</th><th>Treatment</th>
                <th>Date</th><th>Time</th><th></th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="a : ${appointments}">
                <td th:text="${a.appointmentNo}"></td>
                <td th:text="${a.patientName}"></td>
                <td th:text="${a.dentistName}"></td>
                <td th:text="${a.treatmentType}"></td>
                <td th:text="${a.appointmentDate}"></td>
                <td th:text="${a.appointmentTime}"></td>
                <td>
                    <a th:href="@{/bill(appointmentNo=${a.appointmentNo})}" class="btn btn-sm btn-primary">
                        Generate Bill
                    </a>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
