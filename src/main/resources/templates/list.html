<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>All Appointments - Sunrise Dental Clinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>
<div class="container">
    <h2>All Registered Appointments</h2>
    <p th:if="${#lists.isEmpty(appointments)}" class="text-muted">No appointments have been registered yet.</p>
    <table class="table table-striped" th:unless="${#lists.isEmpty(appointments)}">
        <thead>
            <tr>
                <th>No.</th><th>Patient</th><th>Dentist</th><th>Treatment</th>
                <th>Date</th><th>Time</th><th>Billed</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="a : ${appointments}">
                <td th:text="${a.appointmentNo}"></td>
                <td th:text="${a.patientName}"></td>
                <td th:text="${a.dentistName}"></td>
                <td th:text="${a.treatmentType}"></td>
                <td th:text="${a.appointmentDate}"></td>
                <td th:text="${a.appointmentTime}"></td>
                <td th:text="${a.billed} ? 'Yes' : 'No'"></td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
